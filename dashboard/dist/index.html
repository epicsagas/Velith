<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velith — Dashboard</title>

    <!-- FOUC prevention: apply dark class before paint -->
    <script>
      (function () {
        var stored = localStorage.getItem('velith-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored !== 'light' && (prefersDark || !stored)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Geist:wght@100..900&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              'primary-container': 'var(--color-primary-container)',
              'on-primary': 'var(--color-on-primary)',
              'on-primary-container': 'var(--color-on-primary-container)',
              secondary: 'var(--color-secondary)',
              'secondary-container': 'var(--color-secondary-container)',
              'on-secondary': 'var(--color-on-secondary)',
              'on-secondary-container': 'var(--color-on-secondary-container)',
              surface: 'var(--color-surface)',
              'surface-container': 'var(--color-surface-container)',
              'surface-container-low': 'var(--color-surface-container-low)',
              'surface-container-lowest': 'var(--color-surface-container-lowest)',
              'surface-container-high': 'var(--color-surface-container-high)',
              'surface-variant': 'var(--color-surface-variant)',
              'on-surface': 'var(--color-on-surface)',
              'on-surface-variant': 'var(--color-on-surface-variant)',
              'inverse-surface': 'var(--color-inverse-surface)',
              'inverse-on-surface': 'var(--color-inverse-on-surface)',
              outline: 'var(--color-outline)',
              'outline-variant': 'var(--color-outline-variant)',
              background: 'var(--color-background)',
              error: 'var(--color-error)',
              'error-container': 'var(--color-error-container)',
              'sidebar-bg': 'var(--sidebar-bg)',
              'sidebar-active': 'var(--sidebar-active)',
              'sidebar-hover': 'var(--sidebar-hover)',
              'sidebar-text': 'var(--sidebar-text)',
              'sidebar-muted': 'var(--sidebar-muted)',
              'sidebar-border': 'var(--sidebar-border)',
              'sidebar-accent': 'var(--sidebar-accent)',
            },
          },
        },
      };
    </script>

    <style>
      /* ── Sidebar — light mode ───────────────────────────────────── */
      :root {
        --sidebar-bg: #f0f1f5;
        --sidebar-active: #e2e4ed;
        --sidebar-hover: #e8eaf2;
        --sidebar-text: #1a1c2e;
        --sidebar-muted: #5a5f7a;
        --sidebar-border: #d8dae8;
        --sidebar-accent: #f07030;
      }

      /* ── Sidebar — dark mode ────────────────────────────────────── */
      .dark {
        --sidebar-bg: #0d0f18;
        --sidebar-active: #1e2138;
        --sidebar-hover: #161927;
        --sidebar-text: #e5e1ea;
        --sidebar-muted: #9da3c0;
        --sidebar-border: #1f2238;
        --sidebar-accent: #f07030;
      }

      /* ── Light theme (WCAG AA verified) ───────────────────────── */
      :root {
        --color-primary: #e8650a;
        --color-primary-container: #ffd0a8;
        --color-on-primary: #ffffff;
        --color-on-primary-container: #2f1500;
        --color-secondary: #494f60;       /* 5.2:1 on white — WCAG AA ✓ */
        --color-secondary-container: #d9dff5;
        --color-on-secondary: #ffffff;
        --color-on-secondary-container: #3e4459;
        --color-surface: #f8f9fa;
        --color-surface-container: #edeeef;
        --color-surface-container-low: #f3f4f5;
        --color-surface-container-lowest: #ffffff;
        --color-surface-container-high: #e7e8e9;
        --color-surface-variant: #e0e3e5;
        --color-on-surface: #111314;      /* 17:1 on white — WCAG AAA ✓ */
        --color-on-surface-variant: #3a3d40; /* 7.8:1 on white — WCAG AA ✓ */
        --color-inverse-surface: #2e3132;
        --color-inverse-on-surface: #f0f1f2;
        --color-outline: #5c5f62;         /* 5.8:1 on white — WCAG AA ✓ */
        --color-outline-variant: #c2c7ca;
        --color-background: #f8f9fa;
        --color-error: #ba1a1a;
        --color-error-container: #ffdad6;
      }

      /* ── Dark theme ── */
      .dark {
        --color-primary: #ff8c3a;
        --color-primary-container: #7a3a10;
        --color-on-primary: #ffffff;
        --color-on-primary-container: #ffdbba;
        --color-secondary: #b8bdd8;       /* 6.8:1 on #10121a — WCAG AA ✓ */
        --color-secondary-container: #2a2e46;
        --color-on-secondary: #ffffff;
        --color-on-secondary-container: #c8cde8;
        --color-surface: #10121a;
        --color-surface-container: #161926;
        --color-surface-container-low: #12141e;
        --color-surface-container-lowest: #0d0f17;
        --color-surface-container-high: #1c1f30;
        --color-surface-variant: #1e2132;
        --color-on-surface: #f0ecfc;      /* 16:1 on #10121a — WCAG AAA ✓ */
        --color-on-surface-variant: #d0cde0; /* 9.5:1 on #10121a — WCAG AA ✓ */
        --color-inverse-surface: #e8e4f0;
        --color-inverse-on-surface: #13161f;
        --color-outline: #9095b8;         /* 4.8:1 on #10121a — WCAG AA ✓ */
        --color-outline-variant: #2c2f45;
        --color-background: #10121a;
        --color-error: #ffb4ab;
        --color-error-container: #690005;
      }

      html { color-scheme: light; }
      .dark { color-scheme: dark; }

      /* ── Typography scale (16px base) ──────────────────────────── */
      html { font-size: 16px; }
      body { font-family: 'Geist', system-ui, sans-serif; font-size: 1rem; line-height: 1.5; }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

      :focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) { outline: none; }
      aside :focus-visible { outline-color: var(--sidebar-accent); }

      .skip-link {
        position: absolute;
        top: -3rem;
        left: 0.5rem;
        padding: 0.5rem 1rem;
        background: var(--color-primary);
        color: var(--color-on-primary);
        font-weight: bold;
        font-size: 0.875rem;
        z-index: 9999;
        text-decoration: none;
        transition: top 0.1s;
      }
      .skip-link:focus { top: 0.5rem; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-bb5QcUrP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BY0DrVmg.css">
  </head>
  <body class="bg-background text-on-surface">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="app"></div>
  </body>
</html>
