name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update plugin.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json

      - name: Package plugin archive
        run: |
          mkdir -p dist
          tar czf dist/velith-${{ github.ref_name }}.tar.gz \
            agents \
            skills \
            scripts \
            .claude-plugin \
            LICENSE \
            README.md
          zip -r dist/velith-${{ github.ref_name }}.zip \
            agents \
            skills \
            scripts \
            .claude-plugin \
            LICENSE \
            README.md

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
