name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard
        run: |
          cd dashboard
          npm install --legacy-peer-deps
          npm run build

      - name: Package plugin archive
        run: |
          mkdir -p dist
          # Collect all files that exist (avoid tar failures for optional platform dirs)
          FILES=(agents skills client.mjs vendor dashboard/dist .claude-plugin .codex-plugin plugin.json .cursor .clinerules CONVENTIONS.md .aider.conf.yml LICENSE README.md)
          INCLUDE=()
          for f in "${FILES[@]}"; do [ -e "$f" ] && INCLUDE+=("$f"); done
          tar czf "dist/velith-${{ github.ref_name }}.tar.gz" "${INCLUDE[@]}"
          zip -r "dist/velith-${{ github.ref_name }}.zip" "${INCLUDE[@]}"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
